services:
  baby-monitor:
    build: .
    image: ghcr.io/lichifunes/baby-monitor:latest
    container_name: baby-monitor
    restart: unless-stopped
    ports:
      - "${PORT:-8443}:8443"
    environment:
      - PORT=8443
      # REQUIRED: the server's LAN IP and/or hostname, comma-separated. It is
      # written into the TLS certificate (SAN) so devices accept it. Set it via
      # the environment or a local .env file (see .env.example) — never hardcode.
      - CERT_HOSTS=${CERT_HOSTS:?set CERT_HOSTS to your server LAN IP/hostname, e.g. 192.168.1.50}
    volumes:
      - certs:/app/certs

volumes:
  certs:
