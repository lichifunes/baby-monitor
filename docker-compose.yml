services:
  bibino-lan:
    build: .
    container_name: bibino-lan
    # Host networking lets devices reach the server directly on the LAN and
    # keeps WebRTC host ICE candidates routable. (On Docker Desktop/macOS/Windows,
    # host networking is limited — use the ports mapping below instead.)
    network_mode: host
    restart: unless-stopped
    environment:
      - PORT=8443
      # Comma-separated hostnames/IPs to put in the TLS cert's subjectAltName.
      # Required so phones (esp. iOS/WebKit) accept the cert. Set to your PC's LAN IP.
      - CERT_HOSTS=${CERT_HOSTS:-192.168.1.31}
    volumes:
      - ./certs:/app/certs
    # If you cannot use host networking, comment out network_mode above and use:
    # ports:
    #   - "8443:8443"
